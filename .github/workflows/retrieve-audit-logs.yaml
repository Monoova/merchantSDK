name: Retrieve Audit Logs and Events

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  fetch-and-upload-logs:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository (optional)
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Fetch the organization audit logs
      - name: Fetch Organization Audit Logs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # Ensure the token has read:org permissions
        run: |
          curl -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/orgs/Monoova/audit-log \
               -o audit-log.json

      # Step 3: Fetch repository events
      - name: Fetch Repository Events
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/Monoova/merchantSDK/events \
               -o events.json

      # Step 4: Upload both logs as artifacts
      - name: Upload Audit Logs and Events
        uses: actions/upload-artifact@v3
        with:
          name: audit-logs-and-events
          path: |
            audit-log.json
            events.json
