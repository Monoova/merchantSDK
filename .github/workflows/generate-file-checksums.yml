name: Generate File Checksums

on:
  push:
    branches:
      - main # Runs on pushes to the main branch (customize as needed)
      - Monoova
    tags:
      - '*'  # Also runs on tag pushes (optional)

jobs:
  generate-checksums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # Step 1: Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2: Generate checksums for all files in the repository
    - name: Generate Checksums for All Files
      run: |
        find basicImplementation basicImplementationDotNet fullImplementation -type f -exec sha256sum {} \; > FILE_CHECKSUMS.txt

    # Step 3: Upload the checksum file as an artifact (optional)
    - name: Upload FILE_CHECKSUMS.txt as an Artifact
      uses: actions/upload-artifact@v3
      with:
        name: file-checksums
        path: FILE_CHECKSUMS.txt

    # Step 4: Commit changes and create a pull request
    - name: Commit Changes and Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: changes/file-checksums
        commit-message: "Add FILE_CHECKSUMS.txt with generated checksums"
        title: "Update FILE_CHECKSUMS.txt"
        body: |
          This pull request updates the FILE_CHECKSUMS.txt file with the latest generated checksums.
        labels: |
          automated-update

    # Step 5: Push directly (optional, if pull request merging is not required)
    - name: Commit and Push Checksums (if PR merging isn't enforced)
      if: ${{ github.event_name != 'pull_request' }} # Ensures it's only run when not triggered by a PR
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "bambang.lestari@monoova.com"
        
        # Check for changes before committing
        if [[ -n "$(git status --porcelain)" ]]; then
          git add FILE_CHECKSUMS.txt
          git commit -m "Add FILE_CHECKSUMS.txt with generated checksums"
          git push origin HEAD
        else
          echo "No changes to commit."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
